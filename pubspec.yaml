name: smart_media_purge
description: Smart Media Purge and Storage Optimizer - on-device duplicate detection, OCR parsing and face clustering.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  # Media access / deletion
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.2.0
  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # Image + ML (all on-device)
  image: ^4.2.0
  crypto: ^3.0.3
  tflite_flutter: ^0.11.0
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_face_detection: ^0.11.1
  # Privacy vault
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
